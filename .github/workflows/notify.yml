name: PushPlus Notify
on:
  schedule:
    # 每天北京时间 24:20 (次日 00:20) 执行
    # 北京时间 00:20 减去 8 小时 = UTC 时间前一天 16:20
    - cron: '20 16 * * *'

  # 允许手动运行（方便测试）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      # 使用支持 Node.js 24 的稳定版本，避免 Node.js 20 弃用告警
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Send notification
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python scripts/pushplus_notify.py
